[theme]
# Оставь пустым, чтобы использовать системные цвета Hyprland.
# Если хочешь другую цветовую схему, можешь указать путь к файлу.
color_scheme =
# Укажи название твоей любимой темы иконок, например, "Papirus-Dark"
icon_theme = Tela-circle-dracula
# Стиль виджетов. "Fusion" — стандартный, работает всегда.
style = Fusion

# Настройка шрифтов (замени на свои любимые)
font = JetBrains Mono
font_size = 11
font_fixed = JetBrains Mono
font_fixed_size = 11

[misc]
# Приятные мелочи для удобства
single_click_activate = true
menus_have_icons = true
shortcuts_for_context_menus = true
