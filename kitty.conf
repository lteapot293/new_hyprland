# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t no_op
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Маппинги для русской раскладки (чтобы Ctrl+Shift+в работал как вставка)
map ctrl+shift+м paste_from_clipboard
map ctrl+shift+и paste_from_selection
map ctrl+shift+в copy_to_clipboard

# Дополнительные маппинги для других полезных комбинаций
map ctrl+с copy_to_clipboard
map ctrl+м paste_from_clipboard
map ctrl+ы paste_from_selection

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
